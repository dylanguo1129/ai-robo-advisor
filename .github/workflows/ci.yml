name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  python:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7   # tests/test_plan_contribution.py runs the browser engine under node
        with:
          node-version: "24"
      - name: Install (pinned)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Tests (fresh clone = snapshot mode; tests that need the local data cache are skipped)
        run: python -m pytest -q -rs
      - name: Smoke test the CLI on the committed snapshot
        run: python -m robokit status

  web:
    name: Browser engine tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check every ES module
        run: for f in web/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - run: node web/test_parse.mjs
      - run: node web/test_assistant.mjs
      - run: node web/test_engine.mjs
      - run: node web/test_robokit.mjs
      - run: node web/test_safety.mjs
      - run: node web/test_converse.mjs

  ui:
    name: Browser regression tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install (pinned) and the Chromium build Playwright drives
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
          python -m playwright install --with-deps chromium
      - name: Browser tests (the page and the AI stand-in, served from web/)
        run: python -m pytest -m ui -q -rs tests/ui
