<!--
THESIS: One box does everything a first-time investor needs: ask, find a fund, or build a mix. The mix assembles in a docked tray while the person chooses. Refuses the robo-advisor default of a questionnaire wall that ends in a black-box result.
OWN-WORLD: Wealthsimple-style restraint (DESIGN.md): near-white ground, ink text, one deep green accent for actions and selection, five asset-class hues used only in data, Manrope, 1px hairlines, no shadows except popovers, 10/14/999 radii.
STORY: The visitor sees the tool working at once (a reference mix in the tray), types or taps, answers fixed questions as cards, chooses a level, fills each asset class, and reads the result in dollars with its reasons.
FIRST VIEWPORT: Left: a left-aligned question headline, one large input with send, five chips, the AI disclosure. Right: the tray with the live mix, level control and dollar ranges.
FORM: Structure 6 of 7 (search-first box with a docked picks tray; staging from the light-table strip). Seed a86b5353.
-->
<title>Robo-Kit Classic</title>
<meta name="description" content="A do-it-yourself ETF portfolio lab for Canadian and US ETFs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root {
  --ground: #FCFCFC; --surface: #FFFFFF; --surface-2: #F4F4F2; --ink: #111111; --ink-2: #5C5C58; --ink-3: #6B6B66; --rule: #E6E6E2;
  --accent: #1F6B4F; --accent-ink: #FFFFFF; --accent-soft: #E4F1EA; --warn: #B54708; --warn-soft: #FDF1E7; --mark: #FCE8C3;
  --c-equity: #2a78d6; --c-re: #eb6834; --c-fi: #1baf7a; --c-cash: #eda100; --c-com: #e87ba4; --c-multi: #6b7fd6; --c-alt: #8f857b;
  --rule-ctl: #BDBDB8;
  --r-ctl: 10px; --r-panel: 14px; --r-pill: 999px;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --top-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #141414; --surface: #1C1C1C; --surface-2: #242423; --ink: #F2F2F0; --ink-2: #B9B9B3; --ink-3: #8A8A85; --rule: #2E2E2C; --rule-ctl: #6B6B66;
    --accent: #5DBE93; --accent-ink: #0E1F17; --accent-soft: #173327; --warn: #F0A35B; --warn-soft: #33241A; --mark: #4A3A1A;
    --c-equity: #3987e5; --c-re: #d95926; --c-fi: #199e70; --c-cash: #c98500; --c-com: #d55181; --c-multi: #7d8fe6; --c-alt: #a59a8f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #141414; --surface: #1C1C1C; --surface-2: #242423; --ink: #F2F2F0; --ink-2: #B9B9B3; --ink-3: #8A8A85; --rule: #2E2E2C; --rule-ctl: #6B6B66;
  --accent: #5DBE93; --accent-ink: #0E1F17; --accent-soft: #173327; --warn: #F0A35B; --warn-soft: #33241A; --mark: #4A3A1A;
  --c-equity: #3987e5; --c-re: #d95926; --c-fi: #199e70; --c-cash: #c98500; --c-com: #d55181; --c-multi: #7d8fe6; --c-alt: #a59a8f;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body { min-height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; zoom: var(--text-scale, 1); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4, h5 { text-wrap: balance; margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.ico { display: inline-block; vertical-align: -3px; flex: none; }
[hidden] { display: none !important; }
fieldset { min-width: 0; }
html { scroll-padding-top: calc(var(--top-h) * var(--text-scale, 1) + 12px); scroll-padding-bottom: calc(var(--dock-cover, 96px) + 12px); }  /* --dock-cover: the composer (+ phone tray bar) height, set by app.js */

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--top-h); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-inline: 20px; background: var(--ground); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
.brand b { overflow: hidden; text-overflow: ellipsis; }
.top-ctl { flex: none; }
.brand b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-ctl { display: flex; align-items: center; gap: 8px; }
.mkt { display: inline-flex; padding: 3px; border-radius: var(--r-pill); background: var(--surface-2); }
.mkt button { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-pill); font-weight: 600; font-size: 13px; color: var(--ink-2); transition: background .15s var(--ease), color .15s var(--ease); }
.mkt button span { font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.mkt button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.ghostbtn { border: 1px solid var(--rule); background: var(--surface); padding: 6px 12px; border-radius: var(--r-pill); font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.ghostbtn:hover { background: var(--surface-2); }
.set-wrap { position: relative; }
#settings { position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, calc((100vw - 32px) / var(--text-scale, 1))); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-panel); padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.12); display: grid; gap: 12px; z-index: 40; }
#ai-state { font-weight: 600; font-size: 13px; }
#ai-state[data-on="true"] { color: var(--accent); }
#ai-state[data-on="false"] { color: var(--ink-2); }
.tiers { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.tiers legend { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.tiers .seg-row { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: var(--r-pill); }
.tiers label { position: relative; }
.tiers input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.tiers label span { display: block; padding: 6px 14px; border-radius: var(--r-pill); font-weight: 600; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.tiers input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tiers input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: calc(100vh / var(--text-scale, 1) - var(--top-h)); }
.col { min-width: 0; display: flex; flex-direction: column; padding-inline: 32px; }
.col > * { width: 100%; max-width: 760px; margin-inline: auto; }
.landing { padding-top: clamp(40px, 12vh, 104px); display: grid; gap: 12px; }
.landing h1 { font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
.landing p { color: var(--ink-2); font-size: 16px; max-width: 58ch; margin: 0; }
body:not(.is-landing) .landing { display: none; }
#thread { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 24px 8px; }
body.is-landing #thread { padding: 0; }
.dock { position: sticky; bottom: 0; padding-block: 10px 14px; background: var(--ground); box-shadow: 0 -10px 12px -8px var(--ground); display: grid; gap: 8px; }
body:not(.is-landing) .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
body:not(.is-landing) .chips::-webkit-scrollbar { display: none; }
body.is-landing .dock { position: static; background: none; padding-top: 20px; }
#composer { position: relative; display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-panel); padding: 10px 10px 10px 16px; transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
#composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#q { flex: 1; border: 0; outline: 0; resize: none; background: transparent; font-size: 16px; line-height: 1.5; padding: 6px 0; max-height: 160px; }
#q::placeholder { color: var(--ink-3); }
.sendbtn { width: 38px; height: 38px; border-radius: var(--r-pill); border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; transition: transform .1s var(--ease); }
.sendbtn:active { transform: scale(.96); }
#stop { background: var(--ink); color: var(--ground); display: none; }
body.is-streaming #stop { display: grid; }
body.is-streaming #send { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-pill); padding: 7px 14px; font-weight: 600; font-size: 13px; color: var(--ink); transition: background .15s var(--ease), border-color .15s var(--ease); }
.chip:hover { background: var(--surface-2); }
.chip:active { transform: scale(.98); }
.chip:first-child { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:first-child:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
body:not(.is-landing) .chips .chip { padding: 5px 12px; font-size: 12.5px; }
.disclosure { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 70ch; }
.meta { margin: 0; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; }
body:not(.is-landing) .disclosure, body:not(.is-landing) .meta { display: none; }
#footer { font-size: 12.5px; color: var(--ink-3); padding: 16px 32px 24px; border-top: 1px solid var(--rule); }

/* ---------- thread turns and cards ---------- */
.turn-user { justify-self: end; max-width: 80%; background: var(--surface-2); border-radius: var(--r-panel) var(--r-panel) 4px var(--r-panel); padding: 10px 14px; }
.turn-user p { margin: 0; white-space: pre-wrap; }
.turn-user, .ai-text { overflow-wrap: anywhere; }
.turn-note .note { margin: 0; color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.turn-ai { display: grid; gap: 6px; }
.who { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); }
.ai-text p { margin: 0 0 8px; max-width: 68ch; }
.ai-text ul, .ai-text ol { margin: 0 0 8px; padding-left: 20px; max-width: 66ch; }
.ai-text mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.thinking { color: var(--ink-3); }
.thinking::after { content: "..."; display: inline-block; width: 1.2em; animation: dots 1.2s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1.2em; } }
.ai-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
.ai-foot .warn { color: var(--warn); display: inline-flex; gap: 6px; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-panel); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.card p, .card li { overflow-wrap: break-word; }
[data-shelfmsg] { min-width: 0; overflow-wrap: anywhere; }  /* echoes what was typed, which may be one long word */
.card .btn { white-space: normal; text-align: center; }
.card-mix, .card-check { overflow-anchor: none; }  /* replaced in place: anchoring on them jumps the page */
.card h3 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
.card h4 { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.card h5 { font-size: 13px; font-weight: 600; margin-top: 8px; }
.card p { margin: 0; }
.kicker { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--surface); padding: 9px 16px; border-radius: var(--r-ctl); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s var(--ease); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.ghost { border-color: transparent; color: var(--ink-2); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.is-on { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
.btn:disabled { opacity: .55; }
.btn.is-on:disabled { opacity: 1; }
.btn[aria-disabled="true"] { cursor: default; }
.btn.is-on[aria-disabled="true"]:hover { background: var(--accent-soft); }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; }
.link:hover { text-decoration: underline; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.field input { font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--rule-ctl); border-radius: var(--r-ctl); padding: 9px 12px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.field input:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }
select { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-ctl); padding: 8px 10px; max-width: 100%; }
.skel { display: inline-block; height: 12px; width: 120px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--rule), var(--surface-2)); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
.skel.wide { width: 100%; }
.skel-block { height: 220px; border-radius: var(--r-ctl); background: linear-gradient(90deg, var(--surface-2), var(--rule), var(--surface-2)); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }

/* questions */
.q-head { display: flex; align-items: center; gap: 12px; }
.q-count { font-size: 12.5px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-right: auto; }
.card-q h3 { font-size: 17px; font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--rule-ctl); background: var(--surface); border-radius: var(--r-ctl); padding: 11px 14px; font-weight: 500; transition: background .15s var(--ease), border-color .15s var(--ease); }
.opt:hover:not(:disabled) { background: var(--surface-2); }
.opt.is-chosen, .scen-opt.is-chosen { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.card.is-done .opt:not(.is-chosen), .card.is-done .scen-opt:not(.is-chosen) { opacity: .45; }
.scen { display: grid; gap: 8px; }
.scen-opt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 42%); align-items: center; gap: 16px; text-align: left; border: 1px solid var(--rule-ctl); background: var(--surface); border-radius: var(--r-ctl); padding: 11px 14px; font-variant-numeric: tabular-nums; font-weight: 600; }
.scen-range small { display: block; font-weight: 500; }
.scen-opt:hover:not(:disabled) { background: var(--surface-2); }
.rb { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); }
.rb-seg { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; opacity: .8; }
.rb-zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }

/* profile */
.pairs { display: grid; gap: 6px; margin: 0; }
.pairs > div { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.pairs > div:last-child { border-bottom: 0; }
.pairs dt { color: var(--ink-2); }
.pairs dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.pairs .strong dd { color: var(--accent); }
.why { margin: 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 2px; }
.levels { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.levels legend { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
.lvl, .seg { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-ctl); padding: 8px 6px; display: grid; gap: 2px; text-align: center; min-width: 0; }
.lvl b, .seg b { font-size: 16px; font-variant-numeric: tabular-nums; }
.lvl span, .seg span { font-size: 11.5px; color: var(--ink-2); line-height: 1.25; overflow-wrap: anywhere; }
.lvl[aria-pressed="true"], .seg[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lvl[aria-pressed="true"] b, .seg[aria-pressed="true"] b { color: var(--accent); }
.lvl:disabled, .seg:disabled { opacity: .4; }
.lvl:hover:not(:disabled), .seg:hover:not(:disabled) { background: var(--surface-2); }

/* ladder */
.ladder { display: grid; gap: 4px; }
.lad-row { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(70px, 1fr) repeat(3, minmax(64px, auto)); gap: 12px; align-items: center; border: 1px solid transparent; background: none; border-radius: var(--r-ctl); padding: 8px 10px; text-align: left; font-variant-numeric: tabular-nums; width: 100%; color: inherit; }
.lad-name { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; }
button.lad-row:hover { background: var(--surface-2); }
.lad-row.is-on { border-color: var(--accent); background: var(--accent-soft); }
.lad-name { font-weight: 600; }
.lad-name b { color: var(--ink-3); margin-right: 4px; }
.lad-num { display: grid; font-weight: 600; font-size: 13px; text-align: right; }
.lad-num small { font-size: 11px; font-weight: 500; color: var(--ink-3); }
.lad-row.is-on .lad-name b, .lad-row.is-on .lad-num small { color: var(--ink-2); }
.cbar { display: flex; gap: 2px; height: 14px; width: 100%; border-radius: 4px; overflow: hidden; }
.cbar.thin { height: 10px; }
.cbar > span { min-width: 3px; transition: flex-grow .2s var(--ease); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, #tray-classes i, #tray-funds i, .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* shelf */
.shelf { display: grid; }
.shelf-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.shelf-row:last-child { border-bottom: 0; }
.shelf-row .dot { margin-top: 5px; }
.shelf-main { display: grid; gap: 4px; min-width: 0; }
.shelf-main select { width: 100%; }
.shelf-row.is-off .shelf-main { opacity: .45; }
.shelf-add { display: flex; gap: 8px; align-items: end; }
.shelf-add .field { flex: 1; }

/* mix report */
.mix-head { display: grid; gap: 4px; }
.keynums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 4px 0 0; }
.keynums > div { display: grid; gap: 2px; min-width: 0; }
.keynums dd { overflow-wrap: break-word; }
.keynums dt { font-size: 12.5px; color: var(--ink-2); }
.keynums dd { margin: 0; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.keynums dd small { font-weight: 500; color: var(--ink-2); font-size: 12.5px; }
.blk { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--rule); }
.holds { display: grid; gap: 2px; }
.hold { display: grid; grid-template-columns: 170px minmax(80px, 1fr) 52px; grid-template-rows: auto auto; column-gap: 12px; align-items: center; border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 8px; }
.hold:hover { background: var(--surface-2); }
.hold-name { display: grid; line-height: 1.25; min-width: 0; }
.hold-name span { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hold-bar { position: relative; height: 14px; }
.hold-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left; transform: scaleX(var(--w)); border-radius: 0 4px 4px 0; transition: transform .2s var(--ease); }
.hold-bar .band { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: var(--ink); opacity: .55; }
.hold-bar .band::before, .hold-bar .band::after { content: ""; position: absolute; top: -4px; width: 1px; height: 10px; background: var(--ink); }
.hold-bar .band::before { left: 0; } .hold-bar .band::after { right: 0; }
.band-key { display: inline-block; width: 22px; height: 2px; background: var(--ink); opacity: .55; vertical-align: middle; margin-right: 4px; }
.hold-val { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.hold-meta { grid-column: 2 / 4; font-size: 12px; font-variant-numeric: tabular-nums; }
.expl { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 70ch; }
.hp { display: grid; gap: 6px; }

.brand b, .mkt button, .ghostbtn { white-space: nowrap; }

/* ---------- narrow screens ---------- */
@media (max-width: 1099px) {
  .app { grid-template-columns: minmax(0, 1fr); }

  :root { --bar-h: 64px; }
  #tray { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto; max-height: calc(82vh / var(--text-scale, 1)); border-left: 0; border-top: 1px solid var(--rule); border-radius: 18px 18px 0 0; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; box-shadow: 0 -8px 24px rgba(0,0,0,.08); transform: translateY(calc(100% - var(--bar-h) - env(safe-area-inset-bottom, 0px))); transition: transform .2s var(--ease); }
  body.tray-open #tray { transform: none; }

  body.tray-open #tray-close { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; position: absolute; right: 8px; top: 10px; z-index: 2; }

  .dock { bottom: var(--bar-h); }

}
@media (max-width: 1099px) and (max-height: 500px) {

}
@media (max-width: 640px) {
